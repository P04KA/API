syntax = "proto3";
package stats;

option go_package = "gen/stats";

service UserStatsService {
    rpc GetUserStats (UserStatsRequest) returns (UserStatsResponse);
}

message UserStatsRequest{
    string period = 1;
}

message UserStatsResponse{
    int64 usr_created = 1;
    int64 usr_updated = 2;
    int64 usr_deleted = 3;
    string period = 4;

}